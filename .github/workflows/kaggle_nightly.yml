# .github/workflows/kaggle_nightly.yml
#
# AutoPilot — Headless Nightly Kaggle Trigger
# ─────────────────────────────────────────────────────────────────────────────
# Runs daily at 02:00 UTC via GitHub Actions cron.
# Uses the Kaggle API to push and run the notebook headlessly on Kaggle's
# free T4 x2 GPU infrastructure (9-hour background session).
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   KAGGLE_USERNAME   — your Kaggle username
#   KAGGLE_KEY        — your Kaggle API key (from kaggle.com → Account → API)
#   KAGGLE_KERNEL_SLUG — the kernel slug to trigger (e.g. "youruser/autopilot-run")
#
# Optional secrets for multi-account farming (3 accounts × 30h = 90h/week):
#   KAGGLE_USERNAME_2, KAGGLE_KEY_2, KAGGLE_KERNEL_SLUG_2
#   KAGGLE_USERNAME_3, KAGGLE_KEY_3, KAGGLE_KERNEL_SLUG_3
# ─────────────────────────────────────────────────────────────────────────────

name: AutoPilot Nightly GPU Run

on:
  # Primary: daily at 02:00 UTC
  schedule:
    - cron: "0 2 * * *"

  # Secondary: run a second session at 14:00 UTC (fills gaps if first times out)
  # Uncomment to enable:
  # - cron: "0 14 * * *"

  # Manual trigger from GitHub UI (useful for on-demand runs)
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche to run (e.g. personal_finance, saas_tools)"
        required: false
        default: "personal_finance"
      dry_run:
        description: "Dry run (validate kernel push without GPU session)"
        required: false
        default: "false"

jobs:
  trigger-kaggle-account-1:
    name: Trigger Kaggle Account 1
    runs-on: ubuntu-latest
    timeout-minutes: 10   # just the push — Kaggle runs in background

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install --quiet kaggle

      - name: Configure Kaggle credentials (Account 1)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"'"$KAGGLE_USERNAME"'","key":"'"$KAGGLE_KEY"'"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Inject niche into kernel metadata
        run: |
          NICHE="${{ github.event.inputs.niche || 'personal_finance' }}"
          echo "Running niche: $NICHE"
          # Update the kernel_metadata.json if it exists
          if [ -f kernel_metadata.json ]; then
            # Patch the environment variable override for the niche
            python3 -c "
          import json, sys
          with open('kernel_metadata.json', 'r') as f:
              meta = json.load(f)
          # Inject niche env override if the kernel supports it
          meta['enable_gpu'] = True
          meta['enable_internet'] = True
          with open('kernel_metadata.json', 'w') as f:
              json.dump(meta, f, indent=2)
          print('Kernel metadata patched')
            "
          fi

      - name: Push kernel to Kaggle (triggers GPU session)
        env:
          KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — skipping kaggle kernels push"
            exit 0
          fi
          kaggle kernels push -p .
          echo "✅ Kernel pushed to Kaggle. Session will run for up to 9 hours."
          echo "   Monitor at: https://www.kaggle.com/${{ secrets.KAGGLE_USERNAME }}/kernels"

      - name: Verify kernel status
        env:
          KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
        run: |
          sleep 30
          kaggle kernels status ${{ secrets.KAGGLE_USERNAME }}/$KAGGLE_KERNEL_SLUG || true

